- name: Fetch Mux assets
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
        run: node scripts/fetch-assets.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache YAMNet model
        uses: actions/cache@v4
        with:
          path: .cache/yamnet
          key: yamnet-v1

      - name: Install audio analysis deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q ai-edge-litert numpy scipy

      - name: Analyze new videos (Option D)
        run: python scripts/analyze-audio.py --max-per-run 15 --prune

      - name: Commit updated catalogue & intensity files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets.json public/intensity/
          git diff --cached --quiet || git commit -m "Sync Mux assets + audio intensity"
          git push
